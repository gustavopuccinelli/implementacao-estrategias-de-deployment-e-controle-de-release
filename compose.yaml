name: deployment-lab

x-app: &app
  build: ./app
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  blue:
    <<: *app
    environment:
      APP_VERSION: v1
      APP_ENVIRONMENT: blue
    ports:
      - "127.0.0.1:8081:8000"
  green:
    <<: *app
    environment:
      APP_VERSION: v2
      APP_ENVIRONMENT: green
    ports:
      - "127.0.0.1:8082:8000"
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      blue:
        condition: service_healthy
      green:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 10
