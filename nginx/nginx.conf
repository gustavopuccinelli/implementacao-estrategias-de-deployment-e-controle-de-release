# Um worker facilita observar os pesos em uma amostra pequena de requisições.
worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    log_format lab '$remote_addr "$request" status=$status upstream=$upstream_addr tempo=$request_time';
    access_log /dev/stdout lab;
    error_log /dev/stderr warn;
    include /etc/nginx/conf.d/*.conf;
}
